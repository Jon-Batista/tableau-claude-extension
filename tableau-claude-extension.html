<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Claude Analytics - Tableau Extension</title>
    <script src="https://extensions.tableau.com/sites/default/files/archives/tableau-extensions-1.latest.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 20px;
        }
        
        .header h1 {
            font-size: 24px;
            color: #333;
        }
        
        .claude-badge {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }
        
        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .output {
            margin-top: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }
        
        .output h3 {
            color: #333;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .output-content {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            color: #d32f2f;
            padding: 12px;
            background: #ffebee;
            border-radius: 6px;
            margin-top: 15px;
            border-left: 4px solid #d32f2f;
        }
        
        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #1565c0;
            margin-bottom: 20px;
        }
        
        .info-box strong {
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Claude Analytics</h1>
            <span class="claude-badge">POWERED BY CLAUDE</span>
        </div>
        
        <div class="info-box">
            <strong>ℹ️ Configuração Necessária</strong>
            Você precisa configurar a chave de API do Claude antes de usar. Configure nas configurações da extensão.
        </div>
        
        <form id="analysisForm">
            <div class="form-group">
                <label for="apiKey">Chave de API Claude (obrigatório)</label>
                <input 
                    type="password" 
                    id="apiKey" 
                    placeholder="sk-ant-..." 
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="question">Sua pergunta sobre os dados</label>
                <textarea 
                    id="question" 
                    placeholder="Ex: Por que as vendas caíram 12% hoje? Qual é o padrão de vendas por hora?" 
                    required
                ></textarea>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-primary" id="analyzeBtn">
                    <span id="btnText">Analisar com Claude</span>
                </button>
                <button type="button" class="btn-secondary" id="clearBtn">
                    Limpar
                </button>
            </div>
        </form>
        
        <div id="outputContainer" style="display: none;">
            <div class="output">
                <h3>Análise do Claude</h3>
                <div class="output-content" id="outputContent"></div>
            </div>
        </div>
        
        <div id="errorContainer" style="display: none;">
            <div class="error" id="errorContent"></div>
        </div>
    </div>
    
    <script>
        const tableau = window.tableau;
        
        // Inicializar extensão
        tableau.extensions.initializeAsync().then(() => {
            console.log('Extensão Tableau inicializada com sucesso!');
            loadSavedApiKey();
        }).catch(err => {
            console.error('Erro ao inicializar extensão:', err);
        });
        
        // Carregar chave salva (se existir)
        function loadSavedApiKey() {
            const savedKey = localStorage.getItem('claudeApiKey');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
            }
        }
        
        // Submit do formulário
        document.getElementById('analysisForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const apiKey = document.getElementById('apiKey').value.trim();
            const question = document.getElementById('question').value.trim();
            
            if (!apiKey || !question) {
                showError('Por favor, preencha todos os campos!');
                return;
            }
            
            // Salvar chave
            localStorage.setItem('claudeApiKey', apiKey);
            
            // Desabilitar botão e mostrar loading
            const analyzeBtn = document.getElementById('analyzeBtn');
            const btnText = document.getElementById('btnText');
            analyzeBtn.disabled = true;
            btnText.innerHTML = '<span class="loading"></span> Analisando...';
            
            hideError();
            hideOutput();
            
            try {
                // Chamar Claude API
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: 'claude-opus-4-1',
                        max_tokens: 1024,
                        messages: [
                            {
                                role: 'user',
                                content: `Você é um analista de BI experiente analisando dados de Tableau. Responda de forma concisa e acionável.\n\nPergunta: ${question}\n\nForneca insights práticos e recomendações se aplicável.`
                            }
                        ]
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || 'Erro ao chamar API do Claude');
                }
                
                const data = await response.json();
                const analysis = data.content[0].text;
                
                showOutput(analysis);
                
            } catch (error) {
                console.error('Erro:', error);
                showError(`Erro: ${error.message}`);
            } finally {
                analyzeBtn.disabled = false;
                btnText.textContent = 'Analisar com Claude';
            }
        });
        
        // Botão Limpar
        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('question').value = '';
            hideOutput();
            hideError();
            document.getElementById('question').focus();
        });
        
        // Mostrar output
        function showOutput(content) {
            document.getElementById('outputContent').textContent = content;
            document.getElementById('outputContainer').style.display = 'block';
        }
        
        function hideOutput() {
            document.getElementById('outputContainer').style.display = 'none';
        }
        
        // Mostrar erro
        function showError(message) {
            document.getElementById('errorContent').textContent = message;
            document.getElementById('errorContainer').style.display = 'block';
        }
        
        function hideError() {
            document.getElementById('errorContainer').style.display = 'none';
        }
    </script>
</body>
</html>
