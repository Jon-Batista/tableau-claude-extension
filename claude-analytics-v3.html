<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Analytics - BI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 700px;
            width: 100%;
        }
        
        .header {
            margin-bottom: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }
        
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e8e8e8;
        }
        
        .output {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: none;
        }
        
        .output.show {
            display: block;
        }
        
        .output h3 {
            color: #333;
            margin-bottom: 12px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .output-content {
            color: #555;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 14px;
        }
        
        .error {
            background: #ffebee;
            border-color: #d32f2f;
            color: #d32f2f;
            padding: 16px;
            border-radius: 8px;
            margin-top: 16px;
            border-left: 4px solid #d32f2f;
            display: none;
            font-size: 14px;
        }
        
        .error.show {
            display: block;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .info {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            color: #1565c0;
            padding: 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
        }
        
        .info strong {
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Claude Analytics</h1>
            <span class="badge">BI Assistant Powered by Claude</span>
        </div>
        
        <div class="info">
            <strong>💡 Como usar</strong>
            Cole sua chave de API e faça perguntas sobre seus dados de Tableau.
        </div>
        
        <form id="analysisForm">
            <div class="form-group">
                <label for="apiKey">Chave de API Claude *</label>
                <input 
                    type="password" 
                    id="apiKey" 
                    placeholder="sk-ant-v1..." 
                    required
                    autocomplete="off"
                >
            </div>
            
            <div class="form-group">
                <label for="question">Sua pergunta sobre os dados *</label>
                <textarea 
                    id="question" 
                    placeholder="Ex: Por que as vendas caíram 12% hoje? Qual é o padrão de vendas por hora?"
                    required
                ></textarea>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-primary" id="analyzeBtn">
                    <span id="btnText">Analisar com Claude</span>
                </button>
                <button type="button" class="btn-secondary" id="clearBtn">
                    Limpar
                </button>
            </div>
        </form>
        
        <div class="error" id="errorContainer">
            <strong>❌ Erro:</strong> <span id="errorText"></span>
        </div>
        
        <div class="output" id="outputContainer">
            <h3>📊 Análise do Claude</h3>
            <div class="output-content" id="outputContent"></div>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('analysisForm');
        const apiKeyInput = document.getElementById('apiKey');
        const questionInput = document.getElementById('question');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const btnText = document.getElementById('btnText');
        const clearBtn = document.getElementById('clearBtn');
        const outputContainer = document.getElementById('outputContainer');
        const outputContent = document.getElementById('outputContent');
        const errorContainer = document.getElementById('errorContainer');
        const errorText = document.getElementById('errorText');
        
        // URL do backend Vercel
        const BACKEND_URL = 'https://claude-analytics-backend-7u0Sywxec-jon-s-projects25.vercel.app/api/messages';
        
        // Carregar chave salva
        window.addEventListener('load', () => {
            const savedKey = localStorage.getItem('claudeApiKey');
            if (savedKey) {
                apiKeyInput.value = savedKey;
            }
        });
        
        // Submeter formulário
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const apiKey = apiKeyInput.value.trim();
            const question = questionInput.value.trim();
            
            if (!apiKey || !question) {
                showError('Por favor, preencha todos os campos!');
                return;
            }
            
            if (!apiKey.startsWith('sk-ant-')) {
                showError('A chave de API parece inválida. Deve começar com "sk-ant-"');
                return;
            }
            
            localStorage.setItem('claudeApiKey', apiKey);
            
            analyzeBtn.disabled = true;
            btnText.innerHTML = '<span class="loading"></span> Analisando...';
            hideError();
            hideOutput();
            
            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        apiKey: apiKey,
                        message: `Você é um analista de BI experiente. Responda em português, de forma concisa e acionável.\n\nPergunta: ${question}\n\nForneca insights práticos e recomendações.`
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    let errorMsg = 'Erro desconhecido';
                    if (response.status === 401) {
                        errorMsg = 'Chave de API inválida ou expirada';
                    } else if (response.status === 429) {
                        errorMsg = 'Muitas requisições. Tente novamente em alguns momentos.';
                    } else if (errorData.error?.message) {
                        errorMsg = errorData.error.message;
                    }
                    throw new Error(errorMsg);
                }
                
                const data = await response.json();
                
                if (!data.content || !data.content[0]) {
                    throw new Error('Resposta vazia da API');
                }
                
                const analysis = data.content[0].text;
                showOutput(analysis);
                
            } catch (error) {
                showError(`${error.message}`);
            } finally {
                analyzeBtn.disabled = false;
                btnText.textContent = 'Analisar com Claude';
            }
        });
        
        clearBtn.addEventListener('click', () => {
            questionInput.value = '';
            hideOutput();
            hideError();
            questionInput.focus();
        });
        
        function showOutput(content) {
            outputContent.textContent = content;
            outputContainer.classList.add('show');
        }
        
        function hideOutput() {
            outputContainer.classList.remove('show');
        }
        
        function showError(message) {
            errorText.textContent = message;
            errorContainer.classList.add('show');
        }
        
        function hideError() {
            errorContainer.classList.remove('show');
        }
    </script>
</body>
</html>
